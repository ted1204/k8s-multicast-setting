apiVersion: "k8s.cni.cncf.io/v1"
kind: NetworkAttachmentDefinition
metadata:
  name: macvlan-conf
  namespace: default
spec:
  config: '{
      "cniVersion": "0.3.1",
      "type": "macvlan",
      "master": "enp6s18",
      "mode": "bridge",
      "mtu": 1500,
      "ipam": {
        "type": "whereabouts",
        "range": "10.121.124.200-10.121.124.250/24",
        "gateway": "10.121.124.254",
        "routes": [ { "dst": "0.0.0.0/0" } ]
      }
    }'
